<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Deck">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one calm column on warm paper. The card is the page; grades sit under it; a quiet tab bar at the bottom. */
:root {
  --bg: #F4EEE3;        /* warm paper */
  --surface: #FBF8F2;   /* card stock */
  --ink: #2A2621;       /* soft brown-black */
  --muted: #7C7366;
  --line: #E4DACA;
  --accent: #4E5D3A;    /* deep olive */
  --accent-soft: #E7E6D3;
  --again: #A6533F;
  --hard: #9A7531;
  --good: #4E7A4C;
  --easy: #4E5D3A;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --mono: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 540px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 28px calc(100px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 1.7rem; letter-spacing: -0.01em; margin: 0; }
h2 { font-family: var(--display); font-weight: 500; font-size: 1.3rem; margin: 0; text-wrap: balance; }
.counts { font-size: 0.85rem; color: var(--muted); display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 600; }
.label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

/* Flashcard */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  min-height: 320px; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px;
}
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
.state { font-size: 0.8rem; color: var(--muted); font-style: italic; }
.front { font-family: var(--display); font-weight: 500; font-size: clamp(1.75rem, 6.5vw, 2.25rem); line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.back { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.back .fr { font-size: 1.2rem; font-weight: 600; }
.back .ex { font-family: var(--display); font-style: italic; font-size: 1.1rem; color: var(--muted); line-height: 1.45; }
.spacer { flex: 1; }
.listen { align-self: flex-start; }

button, .btn {
  font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 12px 16px; cursor: pointer; touch-action: manipulation;
}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.small { padding: 6px 14px; font-size: 0.85rem; border-radius: 999px; }
button.link { border: 0; background: none; color: var(--accent); padding: 4px 0; }
.show { width: 100%; padding: 16px; font-size: 1.05rem; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px; background: var(--surface); }
.grades button small { font-weight: 400; font-size: 0.78rem; opacity: 0.85; font-variant-numeric: tabular-nums; }
/* Anki-style grade colours: dark red, light red, light green, dark green */
.grades .g0 { background: #9B3B2B; border-color: #9B3B2B; color: #FFF; }
.grades .g1 { background: #F3DAD3; border-color: #E6BFB4; color: #8A3627; }
.grades .g2 { background: #DDE9D5; border-color: #C3D8B6; color: #355E33; }
.grades .g3 { background: #3E6B3B; border-color: #3E6B3B; color: #FFF; }
.verdict.g0 { color: #9B3B2B; } .verdict.g1 { color: #B5523E; } .verdict.g2 { color: #4E7A4C; } .verdict.g3 { color: #3E6B3B; }

.done { text-align: center; padding: 44px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.done .big { font-family: var(--display); font-size: 2.2rem; font-weight: 500; color: var(--accent); line-height: 1.1; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.85rem; font-weight: 600; }
input, textarea, select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 120px; resize: vertical; font-size: 0.85rem; }
textarea.mono { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toast { color: var(--good); font-weight: 600; font-size: 0.9rem; min-height: 1.4em; }
.notice { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 0.92rem; }

/* Stats */
.kpi { display: flex; flex-direction: column; gap: 10px; }
.kpi .num { font-family: var(--display); font-weight: 500; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .num span { font-family: var(--body); font-size: 1rem; color: var(--muted); font-weight: 400; }
.bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 2px; }
.tile .v { font-family: var(--display); font-weight: 500; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--body); font-size: 9px; }

/* Library */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .en { font-family: var(--display); font-size: 1.08rem; min-width: 0; overflow-wrap: anywhere; }
.item .fr2 { color: var(--muted); font-size: 0.9rem; grid-column: 1; min-width: 0; }
.item .st { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; }
.pill { font-size: 0.75rem; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.mastered { color: var(--good); border-color: var(--good); }
.pill.learning { color: var(--hard); border-color: var(--hard); }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
}
nav.tabs .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
nav.tabs button { border: 0; background: none; color: var(--muted); padding: 8px 4px; font-size: 0.82rem; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .card.flip .back { animation: rise 0.25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

/* Say it (FR -> EN) */
.fr-front { font-family: var(--body); font-weight: 600; font-size: clamp(1.4rem, 5.5vw, 1.8rem); }
.muted-front { color: var(--muted); font-size: 1.1rem; }
.hint { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.05em; color: var(--accent); font-size: 1.05rem; overflow-wrap: anywhere; }
.answer { display: flex; flex-direction: column; gap: 10px; }
.answer input { font-size: 1.1rem; background: var(--surface); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.verdict { font-weight: 600; font-size: 0.95rem; }
.verdict.good { color: var(--good); } .verdict.hard { color: var(--hard); } .verdict.again { color: var(--again); }
.yours { color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
.yours .label { margin-right: 6px; }
.en-ans { font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1.25; overflow-wrap: anywhere; }
.en-ans mark { background: none; color: var(--again); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.grades button.suggest { outline: 3px solid var(--ink); outline-offset: 2px; }
.leech { color: var(--again); font-style: normal; font-weight: 600; }
.item .st { flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; }
.pill.leechpill { color: var(--again); border-color: var(--again); }
.tile .label { font-size: 0.66rem; }

/* Game layer */
.strip { display: flex; flex-direction: column; gap: 10px; margin-top: -8px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 0.9rem; }
.goal-n { font-variant-numeric: tabular-nums; }
.goal-n b { font-size: 1.05rem; }
.bonus { color: var(--hard); font-weight: 600; }
.goalbar { height: 10px; margin-top: 6px; }
.goalbar i { transition: width 0.4s ease; }
.goal.won .label { color: var(--good); }
.goal.won .goalbar i { background: var(--good); }
.goal-note { margin: 0; font-size: 0.82rem; }
.tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.88rem; padding-top: 4px; }
.tools a { color: var(--accent); font-weight: 600; text-decoration: none; }
.tools .link { font-size: 0.88rem; color: var(--muted); font-weight: 400; }
.help { font-size: 0.8rem; font-weight: 400; }
.chip { font-size: 0.8rem; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); white-space: nowrap; }
.fx { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px); opacity: 0; pointer-events: none; z-index: 20;
  background: var(--accent); color: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 0.95rem; text-align: center;
  transition: opacity 0.2s, transform 0.2s; box-shadow: 0 6px 20px rgba(42, 38, 33, 0.18); }
.fx span { font-weight: 400; opacity: 0.85; font-size: 0.85rem; }
.fx.show { opacity: 1; transform: translate(-50%, 0); }
.fx.big { border-radius: 16px; padding: 14px 26px; font-weight: 400; font-size: 0.85rem; letter-spacing: 0.04em; }
.fx.big b { display: block; font-family: var(--display); font-weight: 500; font-size: 1.6rem; letter-spacing: 0; margin-top: 2px; }
#confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 19; }
#confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { top: 105vh; transform: rotate(540deg); } }
.done.won .big { color: var(--good); }
.recap { width: 100%; text-align: center; }
.recap .tile { align-items: center; }
.lvl { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
#moreNew { width: 100%; }
.ladder { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; font-size: 0.88rem; }
.ladder li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
.ladder li.past { color: var(--ink); }
.ladder li.past span:first-child::before { content: "✓ "; color: var(--good); }
.ladder li.now { color: var(--accent); font-weight: 600; }
.ladder li.now span:first-child::before { content: "▸ "; }
.chap { display: flex; flex-direction: column; gap: 6px; }
.bar.two { position: relative; }
.bar.two i { position: absolute; left: 0; top: 0; }
.bar.two i.seen { background: var(--line); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px 4px; border-radius: 10px; border: 1px dashed var(--line); font-size: 0.82rem; opacity: 0.55; }
.badge .muted { font-size: 0.72rem; line-height: 1.3; }
.badge .medal { font-size: 1.5rem; color: var(--muted); line-height: 1; }
.badge.on { opacity: 1; border-style: solid; background: var(--accent-soft); }
.badge.on .medal { color: var(--hard); }

/* Decks and auto-grading */
.decks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--accent-soft); padding: 4px; border-radius: 12px; margin-top: -8px; }
.decks button { border: 0; background: none; padding: 9px 8px; font-size: 0.95rem; color: var(--muted); border-radius: 9px; }
.decks button span { font-weight: 400; font-size: 0.8rem; opacity: 0.8; }
.decks button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(42, 38, 33, 0.12); }
.pair { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.pair .show { width: auto; }
.giveup { color: var(--again); border-color: var(--again); background: var(--surface); }
.verdict.g0 { color: var(--again); } .verdict.g1 { color: var(--hard); } .verdict.g2 { color: var(--good); } .verdict.g3 { color: var(--easy); }
.alts { font-size: 0.9rem; }
.hardlist { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; }
.hardlist li span:first-child { display: inline; }
.hardlist li { padding-left: 2px; }
.hardlist li > span:last-child { float: right; }
</style>

<div class="wrap">
  <header class="top">
    <h1>Daily Deck</h1>
    <div class="counts" id="counts"></div>
  </header>
  <div class="decks" id="decks" role="tablist" aria-label="Decks"></div>
  <div class="strip" id="strip"></div>
  <section id="view-review" data-view></section>
  <section id="view-stats" data-view hidden></section>
</div>

<div id="fx" class="fx" role="status" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="review" aria-current="page"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg>Review</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Progress</button>
  </div>
</nav>

<script src="decks.js?v=4"></script>
<script src="app.js?v=5"></script>

</body></html>
