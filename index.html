<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Deck</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Deck">
<meta name="theme-color" content="#F4EEE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Calm paper look: one column, cards as the page, a quiet tab bar at the bottom. */
:root {
  --bg: #F4EEE3; --surface: #FBF8F2; --ink: #2A2621; --muted: #7C7366; --line: #E4DACA;
  --accent: #4E5D3A; --accent-soft: #E7E6D3;
  --again: #9B3B2B; --hard-bg: #F3DAD3; --hard: #8A3627; --good-bg: #DDE9D5; --good: #355E33; --easy: #3E6B3B;
  --new: #3E6B9B; --due: #3E6B3B;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 1.75rem; margin: 0; letter-spacing: -0.01em; }
h2 { font-family: var(--display); font-weight: 500; font-size: 1.3rem; margin: 0; }
.muted { color: var(--muted); }
.small-text { font-size: 0.88rem; }
.label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.top h1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-btn { border: 0; background: none; font-size: 1.6rem; line-height: 1; padding: 6px 8px 6px 0; color: var(--accent); cursor: pointer; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
button, .btn { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 12px 16px; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.wide { width: 100%; padding: 15px; font-size: 1.05rem; }
button.small { padding: 7px 14px; font-size: 0.88rem; border-radius: 999px; }
button.link { border: 0; background: none; padding: 4px 0; color: var(--accent); }
button.danger { color: var(--again); border-color: #E6BFB4; }
button.danger.armed { background: var(--again); color: #fff; border-color: var(--again); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.88rem; font-weight: 600; }
.help { font-size: 0.82rem; color: var(--muted); font-weight: 400; }
input[type=text], input[type=search], textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
textarea.big { min-height: 200px; font-size: 0.95rem; }
.check { display: flex; gap: 10px; align-items: center; font-size: 0.95rem; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--accent-soft); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: none; padding: 9px; color: var(--muted); border-radius: 9px; font-size: 0.95rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(42,38,33,.12); }

/* Deck list */
.decks { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.deck-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 16px 18px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; text-align: left; font-weight: 400; }
.deck-row:last-child { border-bottom: 0; }
.deck-row .name { font-family: var(--display); font-size: 1.2rem; font-weight: 500; overflow-wrap: anywhere; }
.deck-row .sub { font-size: 0.82rem; color: var(--muted); }
.nums { display: flex; gap: 12px; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.95rem; }
.n-new { color: var(--new); } .n-due { color: var(--due); } .n-zero { color: var(--line); }
.empty { text-align: center; padding: 34px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty .big { font-family: var(--display); font-size: 1.6rem; color: var(--accent); }

/* Deck screen */
.study-box { text-align: center; padding: 26px 18px; }
.study-nums { display: flex; justify-content: center; gap: 34px; }
.study-nums div { display: flex; flex-direction: column; align-items: center; }
.study-nums b { font-family: var(--display); font-size: 2.2rem; font-weight: 500; line-height: 1.1; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu button { padding: 14px 10px; font-size: 0.95rem; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-family: var(--display); font-size: 1.5rem; font-weight: 500; }
.stats span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Browse */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 2px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; text-align: left; font-weight: 400; }
.item:last-child { border-bottom: 0; }
.item .f { overflow-wrap: anywhere; white-space: pre-line; }
.item .b { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; grid-column: 1; white-space: pre-line; }
.item .s { grid-row: 1 / span 2; grid-column: 2; font-size: 0.75rem; color: var(--muted); align-self: center; white-space: nowrap; }

/* Study: the flip card */
.study-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.study-top .nums { font-size: 0.9rem; }
.scene { perspective: 1400px; }
.flip { position: relative; display: grid; transition: transform .6s cubic-bezier(.2,.75,.25,1); transform-style: preserve-3d; cursor: pointer; }
.flip.turned { transform: rotateY(180deg); cursor: default; }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-height: 340px; padding: 26px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(42,38,33,.08); }
.face.back { transform: rotateY(180deg); }
.face .tag { font-size: 0.72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.face .q { font-family: var(--display); font-weight: 500; font-size: clamp(1.5rem, 6vw, 2.1rem); line-height: 1.25; white-space: pre-line; overflow-wrap: anywhere; }
.face .q.small-q { font-size: 1.05rem; color: var(--muted); font-family: var(--body); font-weight: 400; }
.face .a { font-family: var(--display); font-weight: 500; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.25; white-space: pre-line; overflow-wrap: anywhere; border-top: 1px solid var(--line); padding-top: 14px; }
.face .a mark { background: none; color: var(--again); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.face .x { font-family: var(--display); font-style: italic; color: var(--muted); font-size: 1.05rem; white-space: pre-line; }
.face .spacer { flex: 1; }
.face .tap { text-align: center; color: var(--muted); font-size: 0.85rem; }
.verdict { font-weight: 600; font-size: 0.95rem; }
.verdict.g1 { color: var(--again); } .verdict.g2 { color: var(--hard); } .verdict.g3 { color: var(--good); } .verdict.g4 { color: var(--easy); }
.yours { color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
.hint { font-family: ui-monospace, Menlo, monospace; color: var(--accent); letter-spacing: .05em; overflow-wrap: anywhere; }
.answer-box { display: flex; flex-direction: column; gap: 10px; }
.answer-box input { font-size: 1.1rem; background: var(--bg); }
.pair { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.giveup { color: var(--again); border-color: var(--again); }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px; }
.grades small { font-weight: 400; font-size: .8rem; opacity: .85; }
.g-1 { background: var(--again); border-color: var(--again); color: #fff; }
.g-2 { background: var(--hard-bg); border-color: #E6BFB4; color: var(--hard); }
.g-3 { background: var(--good-bg); border-color: #C3D8B6; color: var(--good); }
.g-4 { background: var(--easy); border-color: var(--easy); color: #fff; }
.grades button.suggest { outline: 3px solid var(--ink); outline-offset: 2px; }
.enter { animation: enter .35s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateX(28px) rotate(1.5deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .flip { transition: none; } .enter { animation: none; } }

/* Toast and tab bar */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); opacity: 0; pointer-events: none; z-index: 30; background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
nav.tabs button { border: 0; background: none; color: var(--muted); padding: 8px 4px; font-size: .82rem; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="decks" aria-current="page"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="14" rx="2"/><path d="M8 3h11a1 1 0 0 1 1 1v13"/></svg>Decks</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
  </div>
</nav>
<script src="decks.js?v=8"></script>
<script src="app.js?v=9"></script>
</body>
</html>
