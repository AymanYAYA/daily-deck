<style>
/* Layout: one calm column on warm paper. The card is the page; grades sit under it; a quiet tab bar at the bottom. */
:root {
  --bg: #F4EEE3;        /* warm paper */
  --surface: #FBF8F2;   /* card stock */
  --ink: #2A2621;       /* soft brown-black */
  --muted: #7C7366;
  --line: #E4DACA;
  --accent: #4E5D3A;    /* deep olive */
  --accent-soft: #E7E6D3;
  --again: #A6533F;
  --hard: #9A7531;
  --good: #4E7A4C;
  --easy: #4E5D3A;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --mono: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 540px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 28px calc(100px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 1.7rem; letter-spacing: -0.01em; margin: 0; }
h2 { font-family: var(--display); font-weight: 500; font-size: 1.3rem; margin: 0; text-wrap: balance; }
.counts { font-size: 0.85rem; color: var(--muted); display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 600; }
.label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

/* Flashcard */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  min-height: 320px; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px;
}
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--accent); }
.state { font-size: 0.8rem; color: var(--muted); font-style: italic; }
.front { font-family: var(--display); font-weight: 500; font-size: clamp(1.75rem, 6.5vw, 2.25rem); line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.back { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.back .fr { font-size: 1.2rem; font-weight: 600; }
.back .ex { font-family: var(--display); font-style: italic; font-size: 1.1rem; color: var(--muted); line-height: 1.45; }
.spacer { flex: 1; }
.listen { align-self: flex-start; }

button, .btn {
  font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 12px 16px; cursor: pointer; touch-action: manipulation;
}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.small { padding: 6px 14px; font-size: 0.85rem; border-radius: 999px; }
button.link { border: 0; background: none; color: var(--accent); padding: 4px 0; }
.show { width: 100%; padding: 16px; font-size: 1.05rem; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px; background: var(--surface); }
.grades button small { font-weight: 400; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.g0 { color: var(--again) !important; }
.g1 { color: var(--hard) !important; }
.g2 { color: var(--good) !important; }
.g3 { color: var(--easy) !important; }

.done { text-align: center; padding: 44px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.done .big { font-family: var(--display); font-size: 2.2rem; font-weight: 500; color: var(--accent); line-height: 1.1; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.85rem; font-weight: 600; }
input, textarea, select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 120px; resize: vertical; font-size: 0.85rem; }
textarea.mono { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toast { color: var(--good); font-weight: 600; font-size: 0.9rem; min-height: 1.4em; }
.notice { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 0.92rem; }

/* Stats */
.kpi { display: flex; flex-direction: column; gap: 10px; }
.kpi .num { font-family: var(--display); font-weight: 500; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .num span { font-family: var(--body); font-size: 1rem; color: var(--muted); font-weight: 400; }
.bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 2px; }
.tile .v { font-family: var(--display); font-weight: 500; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--body); font-size: 9px; }

/* Library */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .en { font-family: var(--display); font-size: 1.08rem; min-width: 0; overflow-wrap: anywhere; }
.item .fr2 { color: var(--muted); font-size: 0.9rem; grid-column: 1; min-width: 0; }
.item .st { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; }
.pill { font-size: 0.75rem; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.mastered { color: var(--good); border-color: var(--good); }
.pill.learning { color: var(--hard); border-color: var(--hard); }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
}
nav.tabs .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
nav.tabs button { border: 0; background: none; color: var(--muted); padding: 8px 4px; font-size: 0.82rem; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .card.flip .back { animation: rise 0.25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

/* Say it (FR -> EN) */
.fr-front { font-family: var(--body); font-weight: 600; font-size: clamp(1.4rem, 5.5vw, 1.8rem); }
.muted-front { color: var(--muted); font-size: 1.1rem; }
.hint { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.05em; color: var(--accent); font-size: 1.05rem; overflow-wrap: anywhere; }
.answer { display: flex; flex-direction: column; gap: 10px; }
.answer input { font-size: 1.1rem; background: var(--surface); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.verdict { font-weight: 600; font-size: 0.95rem; }
.verdict.good { color: var(--good); } .verdict.hard { color: var(--hard); } .verdict.again { color: var(--again); }
.yours { color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
.yours .label { margin-right: 6px; }
.en-ans { font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1.25; overflow-wrap: anywhere; }
.en-ans mark { background: none; color: var(--again); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.grades button.suggest { border: 2px solid currentColor; }
.leech { color: var(--again); font-style: normal; font-weight: 600; }
.item .st { flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; }
.pill.leechpill { color: var(--again); border-color: var(--again); }
.tile .label { font-size: 0.66rem; }

/* Game layer */
.strip { display: flex; flex-direction: column; gap: 10px; margin-top: -8px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 0.9rem; }
.goal-n { font-variant-numeric: tabular-nums; }
.goal-n b { font-size: 1.05rem; }
.bonus { color: var(--hard); font-weight: 600; }
.goalbar { height: 10px; margin-top: 6px; }
.goalbar i { transition: width 0.4s ease; }
.goal.won .label { color: var(--good); }
.goal.won .goalbar i { background: var(--good); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 0.8rem; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); white-space: nowrap; }
.fx { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px); opacity: 0; pointer-events: none; z-index: 20;
  background: var(--accent); color: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 0.95rem; text-align: center;
  transition: opacity 0.2s, transform 0.2s; box-shadow: 0 6px 20px rgba(42, 38, 33, 0.18); }
.fx span { font-weight: 400; opacity: 0.85; font-size: 0.85rem; }
.fx.show { opacity: 1; transform: translate(-50%, 0); }
.fx.big { border-radius: 16px; padding: 14px 26px; font-weight: 400; font-size: 0.85rem; letter-spacing: 0.04em; }
.fx.big b { display: block; font-family: var(--display); font-weight: 500; font-size: 1.6rem; letter-spacing: 0; margin-top: 2px; }
#confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 19; }
#confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { top: 105vh; transform: rotate(540deg); } }
.done.won .big { color: var(--good); }
.recap { width: 100%; text-align: center; }
.recap .tile { align-items: center; }
.lvl { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
#moreNew { width: 100%; }
.ladder { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; font-size: 0.88rem; }
.ladder li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
.ladder li.past { color: var(--ink); }
.ladder li.past span:first-child::before { content: "✓ "; color: var(--good); }
.ladder li.now { color: var(--accent); font-weight: 600; }
.ladder li.now span:first-child::before { content: "▸ "; }
.chap { display: flex; flex-direction: column; gap: 6px; }
.bar.two { position: relative; }
.bar.two i { position: absolute; left: 0; top: 0; }
.bar.two i.seen { background: var(--line); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px 4px; border-radius: 10px; border: 1px dashed var(--line); font-size: 0.82rem; opacity: 0.55; }
.badge .muted { font-size: 0.72rem; line-height: 1.3; }
.badge .medal { font-size: 1.5rem; color: var(--muted); line-height: 1; }
.badge.on { opacity: 1; border-style: solid; background: var(--accent-soft); }
.badge.on .medal { color: var(--hard); }
</style>

// ---------- Storage ----------
const KEY = "dailydeck.v1";
const DAY = 86400000;
const MASTERED = 21; // a side counts as mastered once its interval reaches 3 weeks
const UNLOCK = 3;    // "say it" (FR → EN) unlocks once you understand the card with a 3-day gap
const HARD = 2;      // a side you missed twice or more shows up in "Hardest cards"
const LEECH = 4;     // missed four times or more: flagged as a leech

// ---------- Game layer ----------
// XP rewards showing up and real memory, never the grade you give yourself:
// 10 XP per card whatever the grade, +5 when a "Say it" answer is exactly right,
// +50 when a side reaches 3 weeks, +100 when the whole expression is mastered,
// +50 for reaching the daily goal, and double XP in the bonus round after it.
const LEVELS = [[0, "Intern"], [300, "Junior Analyst"], [1000, "Analyst"], [2500, "Associate"], [5000, "Consultant"],
  [10000, "Senior Consultant"], [18000, "Manager"], [30000, "Senior Manager"], [50000, "Director"], [80000, "Partner"]];
function levelOf(xp) {
  let i = 0; while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
  const [from, name] = LEVELS[i], to = LEVELS[i + 1] ? LEVELS[i + 1][0] : null;
  return { n: i + 1, name, from, to, next: LEVELS[i + 1] ? LEVELS[i + 1][1] : null, pct: to ? (xp - from) / (to - from) : 1 };
}
const BADGES = [
  ["first", "First step", "Review your first card"],
  ["day1", "Day won", "Reach your daily goal"],
  ["say1", "First words", "Type a Say it card exactly right"],
  ["streak7", "One week", "7 days in a row"],
  ["m10", "Ten down", "Master 10 expressions"],
  ["chapter", "Chapter closed", "Master every card of one theme"],
  ["streak30", "One month", "30 days in a row"],
  ["m50", "Fifty down", "Master 50 expressions"],
  ["all", "Deck complete", "Master every expression"],
];
const isMastered = c => c.interval >= MASTERED && c.p.interval >= MASTERED;
const masteredCount = () => S.cards.filter(isMastered).length;
function doneToday() { const s = dayStart(); return new Set(S.log.filter(l => l.t >= s && !l.practice).map(l => l.id + "|" + (l.dir || "r"))).size; }
function streakNow() {
  const days = new Set([...Object.keys(S.days || {}), ...S.log.filter(l => !l.practice).map(l => dayKey(l.t))]);
  let streak = 0, t = Date.now();
  if (!days.has(dayKey(t))) t -= DAY;
  while (days.has(dayKey(t))) { streak++; t -= DAY; }
  return streak;
}
function chapters() {
  const m = new Map();
  S.cards.forEach(c => {
    if (!m.has(c.tag)) m.set(c.tag, { tag: c.tag, total: 0, seen: 0, mastered: 0 });
    const x = m.get(c.tag); x.total++; if (c.introduced) x.seen++; if (isMastered(c)) x.mastered++;
  });
  return [...m.values()];
}
let fxTimer, fxQueue = [];
function toast(html, big) { fxQueue.push([html, big]); if (fxQueue.length === 1) showFx(); }
function showFx() {
  const [html, big] = fxQueue[0]; const t = $("#fx");
  t.innerHTML = html; t.className = "fx show" + (big ? " big" : "");
  clearTimeout(fxTimer);
  fxTimer = setTimeout(() => { t.className = "fx"; fxQueue.shift(); if (fxQueue.length) setTimeout(showFx, 150); }, big ? 2400 : 900);
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("#confetti"), colors = ["#4E5D3A", "#9A7531", "#A6533F", "#4E7A4C", "#E7E6D3"];
  for (let i = 0; i < 36; i++) {
    const e = document.createElement("i");
    e.style.left = Math.random() * 100 + "vw"; e.style.background = colors[i % colors.length];
    e.style.animationDelay = Math.random() * 0.3 + "s"; e.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(e); setTimeout(() => e.remove(), 2200);
  }
}
function addXp(n, why) {
  const before = levelOf(S.xp);
  S.xp += n; S.xpDay[dayKey()] = (S.xpDay[dayKey()] || 0) + n;
  const after = levelOf(S.xp);
  toast(`+${n} XP${why ? ` <span>${why}</span>` : ""}`);
  if (after.n > before.n) { toast(`Level up<br><b>${after.name}</b>`, true); confetti(); }
}
function award(id) {
  if (S.badges[id]) return;
  S.badges[id] = Date.now();
  const b = BADGES.find(x => x[0] === id);
  toast(`Badge unlocked<br><b>${b[1]}</b>`, true);
}
function checkBadges() {
  if (S.log.some(l => !l.practice)) award("first");
  if (Object.values(S.goal).some(g => g.won)) award("day1");
  const st = streakNow(); if (st >= 7) award("streak7"); if (st >= 30) award("streak30");
  const m = masteredCount(); if (m >= 10) award("m10"); if (m >= 50) award("m50"); if (m >= S.cards.length) award("all");
  if (chapters().some(c => c.mastered === c.total)) award("chapter");
}
let S;
function blank() { return { introduced: null, due: 0, interval: 0, ease: 2.3, reps: 0, lapses: 0 }; }
function makeCard(d, i) { return { id: "d" + (i + 1), en: d[0], fr: d[1], ex: d[2], tag: d[3], ...blank(), p: blank() }; }
function fresh() {
  return { cards: DECK.map(makeCard), log: [], settings: {}, intro: {}, introP: {} };
}
// Older saves (and backups) only had the English → French side: add what is missing.
function normalize() {
  S.settings = Object.assign({ newPerDay: 10, reviewCap: 80 }, S.settings || {});
  S.intro = S.intro || {}; S.introP = S.introP || {}; S.log = S.log || [];
  S.cards.forEach(c => { if (!c.p) c.p = blank(); });
  if (typeof S.xp !== "number") S.xp = 10 * S.log.filter(l => !l.practice).length;
  S.xpDay = S.xpDay || {}; S.goal = S.goal || {}; S.badges = S.badges || {};
}
let merged = 0;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
  if (!S || !Array.isArray(S.cards)) { S = fresh(); normalize(); return; }
  normalize();
  // Cards added to the deck after the first launch join the saved progress and come first in the new cards.
  const have = new Set(S.cards.map(c => c.id));
  DECK.forEach((d, i) => {
    if (have.has("d" + (i + 1))) return;
    S.cards.push({ ...makeCard(d, i), asked: true });
    merged++;
  });
  if (merged) save();
}
// Browsers give each site about 5 MB. Keep the detailed log for 180 days; older days are kept as a simple count per day.
const KEEP_DAYS = 180;
function compact() {
  const limit = dayStart() - KEEP_DAYS * DAY;
  if (!S.log.length || S.log[0].t >= limit) return;
  S.days = S.days || {};
  S.log.forEach(l => { if (l.t < limit && !l.practice) S.days[dayKey(l.t)] = (S.days[dayKey(l.t)] || 0) + 1; });
  S.log = S.log.filter(l => l.t >= limit);
}
function save() { try { compact(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- Dates ----------
function dayStart(t = Date.now()) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function dayKey(t = Date.now()) { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

// ---------- Sides ----------
// Every card has two sides, scheduled separately:
//   "r" = understand it (English → French), stored on the card itself
//   "p" = say it (French → English), stored in card.p
const side = (c, dir) => dir === "p" ? c.p : c;
const byId = id => S.cards.find(c => c.id === id);
const parseQ = q => { const [id, dir] = q.split("|"); return { c: byId(id), dir }; };
const unlocked = c => !!c.introduced && c.interval >= UNLOCK;
const DIRS = { r: "EN → FR", p: "FR → EN" };

// ---------- Scheduler (SM-2 style, the logic behind Anki) ----------
// grade: 0 Again, 1 Hard, 2 Good, 3 Easy. Returns the next gap in days and the new ease.
// elapsed: days since the last review. If you come back late and still remember, the card earned part of that extra time.
function elapsedDays(s) { return s.introduced && s.reps ? Math.max(0, Math.round((dayStart() - (s.due - s.interval * DAY)) / DAY)) : 0; }
function nextState(s, grade, elapsed = s.interval) {
  let { interval, ease, reps, lapses } = s;
  if (grade === 0) return { interval: 1, ease: Math.max(1.3, ease - 0.2), reps: 0, lapses: lapses + 1 };
  const late = Math.max(0, elapsed - interval);
  if (reps === 0) interval = [0, 1, 1, 3][grade];
  else if (reps === 1) interval = [0, 2, 3, 5][grade];
  else if (grade === 1) { interval = Math.max(interval + 1, Math.round(interval * 1.2)); ease -= 0.15; }
  else if (grade === 2) interval = Math.max(interval + 1, Math.round((interval + late / 2) * ease));
  else { interval = Math.max(interval + 1, Math.round((interval + late) * ease * 1.3)); ease += 0.15; }
  return { interval, ease: Math.max(1.3, Math.round(ease * 100) / 100), reps: reps + 1, lapses };
}
function fmtInterval(d) { return d < 30 ? d + "d" : d < 365 ? Math.round(d / 30) + "mo" : (d / 365).toFixed(1) + "y"; }

// ---------- Queue ----------
let queue = [], current = null, flipped = false, sessionDone = 0, backlog = 0, practice = false, practiceDone = false;
let typed = "", verdict = null, hint = false;
function reviewsToday() { const s = dayStart(); return S.log.filter(l => l.t >= s && !l.wasNew && !l.practice).length; }
// Most at risk first: how late a card is, compared with its gap. 2 days late on a 1-day gap matters more than on a 2-month gap.
function risk(s) { return (dayStart() - s.due) / DAY / Math.max(1, s.interval); }
function buildQueue() {
  practice = false;
  const end = dayStart() + DAY;
  const due = [];
  S.cards.forEach(c => {
    if (c.introduced && c.due < end) due.push({ q: c.id + "|r", s: c });
    if (c.p.introduced && c.p.due < end) due.push({ q: c.id + "|p", s: c.p });
  });
  due.sort((a, b) => risk(b.s) - risk(a.s));
  const room = Math.max(0, S.settings.reviewCap - reviewsToday());
  backlog = Math.max(0, due.length - room);
  const reviews = due.slice(0, room).map(x => x.q);
  let fresh = [];
  if (!backlog) { // behind on reviews: no new cards until you catch up
    const k = dayKey();
    const roomR = Math.max(0, S.settings.newPerDay - (S.intro[k] || 0));
    const roomP = Math.max(0, S.settings.newPerDay - (S.introP[k] || 0));
    const newR = S.cards.filter(c => !c.introduced).sort((a, b) => (b.asked ? 1 : 0) - (a.asked ? 1 : 0)).slice(0, roomR).map(c => c.id + "|r");
    const newP = S.cards.filter(c => unlocked(c) && !c.p.introduced).slice(0, roomP).map(c => c.id + "|p");
    for (let i = 0; i < Math.max(newR.length, newP.length); i++) { if (newP[i]) fresh.push(newP[i]); if (newR[i]) fresh.push(newR[i]); }
  }
  queue = [...reviews, ...fresh];
  const k = dayKey();
  if (!S.goal[k]) { S.goal[k] = { target: queue.length + doneToday(), won: false }; save(); }
}
function hardest() {
  const out = [];
  S.cards.forEach(c => ["r", "p"].forEach(dir => { const s = side(c, dir); if (s.lapses >= HARD) out.push({ c, dir, s }); }));
  return out.sort((a, b) => b.s.lapses - a.s.lapses);
}
// Practice: replay your hardest cards. It does not change when they come back.
function startPractice() {
  queue = hardest().slice(0, 15).map(x => x.c.id + "|" + x.dir);
  practice = true; practiceDone = false; next(); go("review");
}
function next() { current = queue[0] || null; flipped = false; typed = ""; verdict = null; hint = false; }

function grade(g) {
  if (!current) return;
  const { c, dir } = parseQ(current);
  const s = side(c, dir);
  if (practice) {
    S.log.push({ t: Date.now(), id: c.id, dir, g, practice: true });
    addXp(5, "practice");
  } else {
    const fullBefore = isMastered(c);
    const wasNew = !s.introduced;
    const elapsed = elapsedDays(s);
    if (wasNew) { s.introduced = Date.now(); const k = dir === "p" ? "introP" : "intro"; S[k][dayKey()] = (S[k][dayKey()] || 0) + 1; }
    const before = s.interval;
    Object.assign(s, nextState(s, g, elapsed));
    s.due = dayStart() + s.interval * DAY;
    S.log.push({ t: Date.now(), id: c.id, dir, g, wasNew, before, after: s.interval });
    const goal = S.goal[dayKey()];
    const bonus = goal && goal.won;
    let xp = 10, why = "";
    if (dir === "p" && verdict && verdict.g === 2 && verdict.cls === "good") { xp += 5; why = "exact"; award("say1"); }
    if (before < MASTERED && s.interval >= MASTERED) { xp += 50; why = "3 weeks reached"; }
    if (!fullBefore && isMastered(c)) { xp += 100; why = "expression mastered"; }
    if (bonus) { xp *= 2; why = why ? why + " · ×2" : "bonus ×2"; }
    addXp(xp, why);
    if (goal && !goal.won && doneToday() >= goal.target) {
      goal.won = true; addXp(50, "daily goal"); toast("Daily goal reached<br><b>Day won</b>", true); confetti();
    }
    checkBadges();
  }
  queue.shift();
  if (g === 0) queue.splice(Math.min(3, queue.length), 0, current); // see it again a few cards later
  if (!queue.length && practice) practiceDone = true;
  sessionDone++;
  save();
  next();
  renderReview();
}

// ---------- Checking a typed or spoken answer ----------
function norm(t) {
  return String(t ?? "").toLowerCase().replace(/['’‘]/g, "").replace(/…/g, " ").replace(/&/g, " and ")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
const core = t => norm(t).replace(/^(to|a|an|the) /, "");
function accepted(expected) {
  const out = [core(expected)];
  const m = expected.match(/^(.*?)\s*\(([^)]+)\)\s*$/); // "return on investment (ROI)": the full form or the acronym both count
  if (m) out.push(core(m[1]), core(m[2]));
  return out.filter(Boolean);
}
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
function similarity(answer, expected) {
  const a = core(answer);
  return a ? Math.max(...accepted(expected).map(e => 1 - lev(a, e) / Math.max(a.length, e.length))) : 0;
}
function check(answer, expected) {
  if (!core(answer)) return { label: "No answer", g: 0, cls: "again" };
  const sim = similarity(answer, expected);
  if (sim === 1) return { label: "Exact", g: 2, cls: "good" };
  if (sim >= 0.85) return { label: "Almost: look at the small differences", g: 1, cls: "hard" };
  return { label: "Not quite", g: 0, cls: "again" };
}
// Underline the words of the expected answer that you did not say.
function diff(answer, expected) {
  const got = new Set(norm(answer).split(" "));
  return expected.split(/(\s+)/).map(w => /^\s+$/.test(w) || !norm(w) || got.has(norm(w)) ? esc(w) : `<mark>${esc(w)}</mark>`).join("");
}
const hintOf = t => t.split(" ").map(w => w.replace(/(^[^A-Za-z]*[A-Za-z])|[A-Za-z]/g, (m, first) => first || "_")).join("  ");

// ---------- Speech ----------
function speak(text) {
  try { const u = new SpeechSynthesisUtterance(text.replace("…", "")); u.lang = "en-GB"; u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

// ---------- Rendering ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function renderStrip() {
  const g = S.goal[dayKey()], d = doneToday(), lv = levelOf(S.xp), st = streakNow();
  const target = g ? g.target : 0, won = g && g.won;
  const pct = target ? Math.min(1, d / target) : (d ? 1 : 0);
  $("#strip").innerHTML = `
    <div class="goal ${won ? "won" : ""}">
      <div class="goal-top"><span class="label">${won ? "Day won" : "Today's goal"}</span>
        <span class="goal-n"><b>${Math.min(d, target)}</b> / ${target}${d > target ? ` <span class="bonus">+${d - target} bonus</span>` : ""}</span></div>
      <div class="bar goalbar"><i style="width:${pct * 100}%"></i></div>
    </div>
    <div class="chips">
      <span class="chip"><b>Lv ${lv.n}</b> ${lv.name}</span>
      <span class="chip" title="Days in a row">🔥 <b>${st}</b></span>
      <span class="chip"><b>${S.xp.toLocaleString("en")}</b> XP</span>
    </div>`;
}
function renderCounts() {
  renderStrip();
  if (practice) { $("#counts").innerHTML = `<span>Practice <b>${queue.length}</b></span>`; return; }
  const newLeft = queue.filter(q => { const { c, dir } = parseQ(q); return !side(c, dir).introduced; }).length;
  $("#counts").innerHTML = `<span>New <b>${newLeft}</b></span><span>Review <b>${queue.length - newLeft}</b></span>`;
}

function renderReview() {
  renderCounts();
  const v = $("#view-review");
  if (!current) {
    if (practiceDone) {
      practice = false; practiceDone = false;
      v.innerHTML = `<div class="panel done"><div class="big">Practice done</div>
        <p class="muted" style="margin:0">Your schedule did not change. These cards still come back on their usual day.</p>
        <div class="row" style="justify-content:center"><button class="small" id="backReview">Back to today's review</button></div></div>`;
      $("#backReview").onclick = () => { buildQueue(); next(); renderReview(); };
      return;
    }
    const tomorrow = S.cards.reduce((n, c) => n + (c.introduced && c.due < dayStart() + 2 * DAY ? 1 : 0) + (c.p.introduced && c.p.due < dayStart() + 2 * DAY ? 1 : 0), 0);
    const k = dayKey(), g = S.goal[k], won = g && g.won, lv = levelOf(S.xp);
    const t0 = dayStart(), today = S.log.filter(l => l.t >= t0 && !l.practice);
    const met = today.filter(l => l.wasNew).length;
    const levelUp = today.filter(l => l.before < MASTERED && l.after >= MASTERED).length;
    v.innerHTML = `<div class="panel done ${won ? "won" : ""}">
      <div class="big">${won ? "Day won" : "All clear"}</div>
      <p class="muted" style="margin:0">${won ? "Daily goal reached. Everything from here is bonus, with double XP." : "Nothing left to review right now."}</p>
      <div class="tiles recap">
        <div class="tile"><span class="v">${doneToday()}</span><span class="label">cards today</span></div>
        <div class="tile"><span class="v">${met}</span><span class="label">new sides met</span></div>
        <div class="tile"><span class="v">${S.xpDay[k] || 0}</span><span class="label">XP today</span></div>
      </div>
      ${levelUp ? `<p style="margin:0">${levelUp} side${levelUp > 1 ? "s" : ""} reached the 3-week mark today.</p>` : ""}
      <div class="lvl">
        <div class="goal-top"><span><b>Lv ${lv.n}</b> · ${lv.name}</span><span class="muted">${lv.to ? `${(lv.to - S.xp).toLocaleString("en")} XP to ${lv.next}` : "Top level"}</span></div>
        <div class="bar"><i style="width:${lv.pct * 100}%"></i></div>
      </div>
      <p class="muted" style="margin:0;font-size:.9rem">${tomorrow} card${tomorrow === 1 ? "" : "s"} due tomorrow. Come back to keep your 🔥 ${streakNow()}-day streak.</p>
      ${backlog ? `<p class="muted" style="margin:0">${backlog} older review${backlog > 1 ? "s" : ""} will wait for tomorrow, so the daily load stays light.</p>` :
      `<button class="primary" id="moreNew" type="button">Bonus round · 5 new cards${won ? " · double XP" : ""}</button>`}
    </div>`;
    if (!backlog) $("#moreNew").onclick = () => { S.settings.newPerDay += 5; buildQueue(); S.settings.newPerDay -= 5; next(); renderReview(); };
    return;
  }
  const { c, dir } = parseQ(current);
  const s = side(c, dir);
  const say = dir === "p";
  const notes = [];
  if (merged) notes.push(`${merged} new card${merged > 1 ? "s" : ""} added to your deck. They come first.`);
  if (backlog && !practice && reviewsToday() === 0) notes.push(`You were away for a bit. Today is capped at ${S.settings.reviewCap} reviews, most urgent first; new cards are paused until you catch up.`);
  if (practice) notes.push(`Practice: your hardest cards. Grading here does not change your schedule.`);
  const status = !s.introduced ? "new" : s.interval >= MASTERED ? "mastered" : "learning";
  const leech = s.lapses >= LEECH ? ` · <span class="leech">hard card</span>` : "";
  const previews = practice ? ["", "", "", ""] : [0, 1, 2, 3].map(g => fmtInterval(nextState(s, g, elapsedDays(s)).interval));
  const suggest = verdict ? verdict.g : -1;

  let body;
  if (!say) {
    body = `<div class="front">${esc(c.en)}</div>
      <button class="small listen" id="listen" type="button">Listen</button>
      ${flipped ? `<div class="back"><div class="fr">${esc(c.fr)}</div>${c.ex ? `<div class="ex">“${esc(c.ex)}”</div>` : ""}</div>`
        : `<div class="spacer"></div><p class="muted" style="margin:0;font-size:.9rem">Say what it means, out loud if you can, then check.</p>`}`;
  } else if (!flipped) {
    body = `<div class="front fr-front">${esc(c.fr)}</div>
      ${hint ? `<div class="hint" aria-label="Hint">${esc(hintOf(c.en))}</div>` : ""}
      <div class="spacer"></div>
      <div class="answer">
        <label for="ans" class="sr">Your answer in English</label>
        <input id="ans" type="text" placeholder="Type it in English" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" value="${esc(typed)}">
        <div class="row">
          ${hint ? "" : `<button class="small" id="hintBtn" type="button">Hint</button>`}
        </div>
      </div>`;
  } else {
    body = `<div class="front fr-front muted-front">${esc(c.fr)}</div>
      <div class="back">
        ${verdict ? `<div class="verdict ${verdict.cls}">${verdict.label}</div>
          ${typed.trim() ? `<div class="yours"><span class="label">You said</span> ${esc(typed)}</div>` : ""}` : ""}
        <div class="en-ans">${typed.trim() ? diff(typed, c.en) : esc(c.en)}</div>
        ${c.ex ? `<div class="ex">“${esc(c.ex)}”</div>` : ""}
        <button class="small listen" id="listen" type="button">Listen</button>
      </div>`;
  }

  v.innerHTML = (notes.length ? notes.map(n => `<div class="notice" role="status">${n}</div>`).join("") : "") +
    `<article class="card ${flipped ? "flip" : ""}" aria-live="polite">
      <div class="meta"><span class="tag">${esc(c.tag)} · ${say ? "Say it" : "Understand it"}</span><span class="state">${DIRS[dir]} · ${status}${leech}</span></div>
      ${body}
    </article>
    ${flipped ? `<div class="grades">
      ${["Again", "Hard", "Good", "Easy"].map((n, g) => `<button class="g${g}${g === suggest ? " suggest" : ""}" data-g="${g}">${n}<small>${g === suggest ? "suggested" : previews[g]}</small></button>`).join("")}
    </div>` : `<button class="primary show" id="showBtn">${say ? "Check" : "Show answer"}</button>`}`;

  const L = $("#listen"); if (L) L.onclick = () => speak(c.en);
  if (flipped) { v.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grade(+b.dataset.g)); return; }
  const reveal = () => {
    if (say) { typed = $("#ans").value; verdict = check(typed, c.en); }
    flipped = true; merged = 0; renderReview();
  };
  $("#showBtn").onclick = reveal;
  if (say) {
    const ans = $("#ans");
    ans.oninput = () => { typed = ans.value; };
    ans.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); reveal(); } };
    const h = $("#hintBtn"); if (h) h.onclick = () => { typed = ans.value; hint = true; renderReview(); };
    if (matchMedia("(pointer: fine)").matches) ans.focus();
  }
}

function retentionOf(dir) {
  const since = Date.now() - 30 * DAY;
  const r = S.log.filter(l => l.t >= since && !l.wasNew && !l.practice && (l.dir || "r") === dir);
  return r.length ? Math.round(100 * r.filter(l => l.g > 0).length / r.length) + "%" : "–";
}

function renderStats() {
  const v = $("#view-stats");
  const mastered = S.cards.filter(c => c.interval >= MASTERED && c.p.interval >= MASTERED).length;
  const goal = 1000;
  const learning = S.cards.filter(c => c.introduced).length - mastered;
  const streak = streakNow();
  // last 14 days
  const bars = [];
  for (let i = 13; i >= 0; i--) { const s = dayStart() - i * DAY; bars.push({ s, n: S.log.filter(l => l.t >= s && l.t < s + DAY).length }); }
  const max = Math.max(10, ...bars.map(b => b.n));
  const W = 320, H = 120, pad = 18, bw = (W - pad) / 14;
  const top = Math.ceil(max / 10) * 10;
  const svg = `<svg viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="Cards reviewed per day over the last 14 days">
    <line x1="${pad}" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
    <line x1="${pad}" x2="${W}" y1="4" y2="4" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="0" y="8">${top}</text><text x="0" y="${H}">0</text>
    ${bars.map((b, i) => { const h = b.n ? Math.max(2, (b.n / top) * (H - 4)) : 0; const x = pad + i * bw + 2;
      return `<rect x="${x}" y="${H - h}" width="${bw - 4}" height="${h}" rx="2" fill="${i === 13 ? "var(--accent)" : "var(--accent-soft)"}"/>` +
        (i % 2 === 1 ? `<text x="${x + (bw - 4) / 2}" y="${H + 13}" text-anchor="middle">${new Date(b.s).getDate()}</text>` : ""); }).join("")}
  </svg>`;
  const hard = hardest();
  const lv = levelOf(S.xp);
  const ladder = LEVELS.map(([x, name], i) => `<li class="${i + 1 < lv.n ? "past" : i + 1 === lv.n ? "now" : ""}"><span>${name}</span><span class="muted">${x.toLocaleString("en")} XP</span></li>`).join("");
  const chaps = chapters().map(ch => `<div class="chap">
      <div class="goal-top"><span><b>${esc(ch.tag)}</b>${ch.mastered === ch.total ? " · closed" : ""}</span><span class="muted">${ch.mastered} mastered · ${ch.seen} started / ${ch.total}</span></div>
      <div class="bar two"><i class="seen" style="width:${100 * ch.seen / ch.total}%"></i><i style="width:${100 * ch.mastered / ch.total}%"></i></div>
    </div>`).join("");
  const badges = BADGES.map(([id, name, how]) => `<div class="badge ${S.badges[id] ? "on" : ""}"><span class="medal">${S.badges[id] ? "★" : "☆"}</span><b>${name}</b><span class="muted">${how}</span></div>`).join("");
  v.innerHTML = `
  <div class="panel kpi">
    <span class="label">Your level</span>
    <div class="num">Lv ${lv.n} <span>${lv.name}</span></div>
    <div class="bar"><i style="width:${lv.pct * 100}%"></i></div>
    <span class="muted" style="font-size:.85rem">${S.xp.toLocaleString("en")} XP${lv.to ? ` · ${(lv.to - S.xp).toLocaleString("en")} to ${lv.next}` : ""}. XP comes from showing up and from real memory, never from the grade you give yourself.</span>
    <ol class="ladder">${ladder}</ol>
  </div>
  <div class="panel">
    <h2>Chapters</h2>
    <p class="muted" style="margin:0;font-size:.85rem">Close a chapter by mastering all its cards. Light bar: started. Dark bar: mastered.</p>
    ${chaps}
  </div>
  <div class="panel">
    <h2>Badges <span class="muted" style="font-size:1rem">${Object.keys(S.badges).length} / ${BADGES.length}</span></h2>
    <div class="badges">${badges}</div>
  </div>
  <div class="panel kpi">
    <span class="label">Goal before May 2027</span>
    <div class="num">${mastered} <span>/ ${goal} expressions mastered</span></div>
    <div class="bar"><i style="width:${Math.min(100, (mastered / goal) * 100)}%"></i></div>
    <span class="muted" style="font-size:.85rem">An expression is mastered when you can still understand it <em>and</em> say it three weeks after your last review. ${learning} in progress.</span>
  </div>
  <div class="panel">
    <div class="tiles">
      <div class="tile"><span class="label">Understand</span><span class="v">${retentionOf("r")}</span><span class="muted" style="font-size:.78rem">EN → FR, 30 days</span></div>
      <div class="tile"><span class="label">Say it</span><span class="v">${retentionOf("p")}</span><span class="muted" style="font-size:.78rem">FR → EN, 30 days</span></div>
      <div class="tile"><span class="label">Streak</span><span class="v">${streak}</span><span class="muted" style="font-size:.78rem">day${streak === 1 ? "" : "s"} in a row</span></div>
    </div>
    <div class="chart"><span class="label">Reviews per day</span>${svg}</div>
  </div>
  <div class="panel">
    <h2>Hardest cards</h2>
    ${hard.length ? `<div class="list">${hard.slice(0, 8).map(x => `<div class="item"><span class="en">${esc(x.c.en)}</span><span class="fr2">${esc(x.c.fr)}</span>
      <span class="st"><span class="pill ${x.s.lapses >= LEECH ? "leechpill" : "learning"}">${DIRS[x.dir]} · missed ${x.s.lapses}×</span></span></div>`).join("")}</div>
      <button class="primary" id="practiceBtn" type="button">Practice these now</button>
      <p class="muted" style="margin:0;font-size:.85rem">Practice does not change your schedule. If a card stays here for weeks, rewrite its example sentence with your own words.</p>`
      : `<p class="muted" style="margin:0">Nothing yet. Cards you miss twice or more show up here, so you can drill them.</p>`}
  </div>
  <div class="panel">
    <h2>Settings and backup</h2>
    <div class="field"><label for="npd">New cards per day (each side)</label>
      <select id="npd">${[5, 10, 15, 20, 30].map(n => `<option ${n === S.settings.newPerDay ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="field"><label for="cap">Maximum reviews per day</label>
      <select id="cap">${[40, 60, 80, 120, 200].map(n => `<option ${n === S.settings.reviewCap ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <p class="muted" style="margin:0;font-size:.9rem">Your cards are saved on this device only. Copy a backup now and then, and use the review log for analysis in Python.</p>
    <div class="row">
      <button class="small" id="expJson" type="button">Backup (JSON)</button>
      <button class="small" id="expCsv" type="button">Review log (CSV)</button>
      <button class="small" id="impBtn" type="button">Restore a backup</button>
    </div>
    <div class="field" id="ioBox" hidden><label for="io" id="ioLabel">Data</label><textarea id="io" class="mono"></textarea>
      <div class="row"><button class="small primary" id="ioAction" type="button">Copy</button><button class="small" id="ioDownload" type="button">Download file</button><span class="toast" id="ioToast" role="status"></span></div>
    </div>
  </div>`;
  const pb = $("#practiceBtn"); if (pb) pb.onclick = startPractice;
  $("#npd").onchange = e => { S.settings.newPerDay = +e.target.value; save(); buildQueue(); next(); };
  $("#cap").onchange = e => { S.settings.reviewCap = +e.target.value; save(); buildQueue(); next(); };
  const box = $("#ioBox"), io = $("#io"), act = $("#ioAction"), dl = $("#ioDownload"), toast = $("#ioToast");
  let file = null;
  function show(label, text, name, mode) {
    box.hidden = false; $("#ioLabel").textContent = label; io.value = text; toast.textContent = "";
    file = name; dl.hidden = mode === "import" || !location.hostname.endsWith("github.io"); act.textContent = mode === "import" ? "Restore" : "Copy"; act.dataset.mode = mode;
  }
  $("#expJson").onclick = () => show("Backup", JSON.stringify(S), "daily-deck-backup.json", "export");
  $("#expCsv").onclick = () => {
    const rows = ["timestamp,date,card_id,direction,english,grade,was_new,practice,interval_before,interval_after"].concat(
      S.log.map(l => { const c = byId(l.id); return [new Date(l.t).toISOString(), dayKey(l.t), l.id, l.dir || "r", '"' + (c ? c.en : "").replace(/"/g, '""') + '"', l.g, l.wasNew ? 1 : 0, l.practice ? 1 : 0, l.before ?? "", l.after ?? ""].join(","); }));
    show("Review log", rows.join("\n"), "daily-deck-log.csv", "export");
  };
  $("#impBtn").onclick = () => show("Paste a backup here", "", null, "import");
  act.onclick = () => {
    if (act.dataset.mode === "import") {
      try { const d = JSON.parse(io.value); if (!Array.isArray(d.cards)) throw 0; S = d; normalize(); save(); buildQueue(); next(); toast.textContent = "Backup restored."; renderStats(); }
      catch (e) { toast.textContent = "This text is not a Daily Deck backup. Paste the full JSON you copied."; }
      return;
    }
    const done = () => toast.textContent = "Copied.";
    try { navigator.clipboard.writeText(io.value).then(done, () => { io.select(); toast.textContent = "Selected. Copy it with your keyboard."; }); }
    catch (e) { io.select(); toast.textContent = "Selected. Copy it with your keyboard."; }
  };
  dl.onclick = () => {
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([io.value], { type: "text/plain" })); a.download = file; a.click(); toast.textContent = "Download started (if your browser allows it)."; }
    catch (e) { toast.textContent = "Downloads are blocked here. Use Copy instead."; }
  };
}

function sideStatus(c, dir) {
  const s = side(c, dir);
  if (!s.introduced) return [dir === "p" && !unlocked(c) ? "locked" : "new", ""];
  if (s.interval >= MASTERED) return ["mastered", "mastered"];
  return ["in " + fmtInterval(Math.max(0, Math.round((s.due - dayStart()) / DAY))), s.lapses >= LEECH ? "leechpill" : "learning"];
}
function renderLibrary() {
  const q = $("#search").value.trim().toLowerCase();
  const items = S.cards.filter(c => !q || (c.en + " " + c.fr).toLowerCase().includes(q));
  $("#list").innerHTML = items.length ? items.map(c => {
    const pills = ["r", "p"].map(dir => { const [t, cls] = sideStatus(c, dir); return `<span class="pill ${cls}">${DIRS[dir]} ${t}</span>`; }).join("");
    return `<div class="item"><span class="en">${esc(c.en)}</span><span class="fr2">${esc(c.fr)}</span>
      <span class="st">${pills}</span></div>`;
  }).join("") : `<p class="muted">No card matches “${esc(q)}”.</p>`;
}

$("#search").oninput = renderLibrary;

// ---------- Tabs ----------
function go(tab) {
  document.querySelectorAll("[data-view]").forEach(s => s.hidden = s.id !== "view-" + tab);
  document.querySelectorAll("[data-tab]").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  renderStrip();
  if (tab === "review") { if (!current && !practiceDone) { buildQueue(); next(); } renderReview(); }
  if (tab === "stats") renderStats();
  if (tab === "library") renderLibrary();
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));

// Keyboard: space shows the answer, 1-4 grade the card
document.addEventListener("keydown", e => {
  if ($("#view-review").hidden || /input|textarea|select/i.test(e.target.tagName)) return;
  if (!flipped && (e.key === " " || e.key === "Enter") && current) { e.preventDefault(); $("#showBtn").click(); }
  else if (flipped && "1234".includes(e.key)) grade(+e.key - 1);
});

load(); buildQueue(); next(); renderReview();
try { if ("serviceWorker" in navigator && location.protocol === "https:" && !location.hostname.endsWith("claude.ai")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
</script>

</body></html>
